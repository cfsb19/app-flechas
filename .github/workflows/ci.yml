name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do cálculo e da lógica
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Testes no browser
        run: npm run e2e
