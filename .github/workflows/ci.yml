name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do cálculo e da lógica
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Testes no browser
        run: npm run e2e
      - name: Cópia num único ficheiro HTML (sem login)
        run: npm run build:html
      - uses: actions/upload-artifact@v4
        with:
          name: flechas-html
          path: dist-local/flechas.html
          retention-days: 30
