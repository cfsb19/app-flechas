name: Publicar (PWA + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar configuração (ver docs/configuracao.md)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HOSTING_URL: ${{ vars.HOSTING_URL }}
        run: bash scripts/check-release-config.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - name: Build da PWA
        env:
          VITE_HOSTING_URL: ${{ vars.HOSTING_URL }}
          VITE_ALERTA_URL: ${{ vars.ALERTA_URL }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build do APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          APK_URL: ${{ vars.APK_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/flechas.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          npx cap sync android
          (cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease)
          mkdir -p apk && cp android/app/build/outputs/apk/release/app-release.apk "apk/flechas-$(node -p "require('./package.json').version").apk"
          node -e "const v=require('./package.json').version; require('fs').writeFileSync('dist/version.json', JSON.stringify({version:v, apk:process.env.APK_URL||''}))"
        # O plano Spark do Firebase não aceita ficheiros executáveis (.apk): o APK fica como artefacto
        # privado do GitHub e é partilhado à parte (por exemplo pelo Google Drive, ver docs/configuracao.md).

      - uses: actions/upload-artifact@v4
        with:
          name: flechas-apk
          path: apk/*.apk
          retention-days: 90

      # As regras vão antes da app: uma app nova com regras antigas não deixaria ninguém entrar.
      - name: Publicar as regras do Firestore (pedidos de acesso)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15.36.0 deploy --only firestore:rules --project default --non-interactive

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
